name: Android Debug validation
on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/check-modularity.py
      - run: python3 scripts/check-kotlin-style.py
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-results
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
